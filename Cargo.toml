[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.metadata.crane]
name = "ranki"

[workspace.package]
version    = "0.1.0"
repository = "https://github.com/DontBlameMeDev/ranki"
edition    = "2024"
license    = "GPL-3.0-or-later"

[workspace.dependencies]
ranki-model = { path = "crates/model" }
ranki-core = { path = "crates/core" }
ranki-storage = { path = "crates/storage" }
ranki-format = { path = "crates/format" }
ranki-ui = { path = "crates/ui" }
ranki-sync = { path = "crates/sync" }

chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
gpui = { version = "=0.2.2", default-features = false, features = ["wayland"] }
latex-rust = { version = "3.0", features = ["png"] }
rand = "=0.10.1"
sha1 = "0.10"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.9"
thiserror = "2"
tiny_http = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

# zed-async-tar 0.5 still requires xattr 0.2, which refers to libc::ENOATTR.
# Current libc only exposes ENODATA on Linux. Upstream fixed this in xattr 1.7,
# but that release is semver-incompatible with zed-async-tar.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

[workspace.lints.rust]
unsafe_code      = "deny"
unused_imports   = "deny"
unused_variables = "deny"
unused_mut       = "deny"
dead_code        = "deny"

[workspace.lints.clippy]
pedantic                      = "deny"
unwrap_used                   = "deny"
expect_used                   = "deny"
panic                         = "deny"
shadow_reuse                  = "deny"
todo                          = "deny"
unimplemented                 = "deny"
dbg_macro                     = "deny"
undocumented_unsafe_blocks    = "deny"
indexing_slicing              = "deny"
cast_possible_truncation      = "deny"
cast_sign_loss                = "deny"
cast_possible_wrap            = "deny"
cast_precision_loss           = "deny"
arithmetic_side_effects       = "deny"
multiple_unsafe_ops_per_block = "deny"
wildcard_imports              = "deny"
enum_glob_use                 = "deny"
unused_result_ok              = "deny"
absolute_paths                = "deny"
allow_attributes              = "deny"
missing_panics_doc            = "deny"
unsafe_derive_deserialize     = "deny"
cast_ptr_alignment            = "deny"
result_unit_err               = "deny"
or_fun_call                   = "deny"
expect_fun_call               = "deny"
cast_lossless                 = "deny"
vec_resize_to_zero            = "deny"
clone_on_ref_ptr              = "deny"
rc_buffer                     = "deny"
arc_with_non_send_sync        = "deny"
wildcard_enum_match_arm       = "deny"
match_same_arms               = "deny"
single_match_else             = "deny"
missing_const_for_fn          = "deny"
redundant_pub_crate           = "deny"
option_if_let_else            = "deny"
needless_pass_by_ref_mut      = "deny"
integer_division              = "deny"
use_self                      = "deny"
redundant_clone               = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
