[test_config]
fail-under = 80.0
exclude-files = [
  "crates/bin/src/main.rs",
  "crates/bench/src/*",
  # GPUI view builders need a window and GPU surface, so they cannot run in CI.
  # Their behavior is covered by the core, storage and CLI tests and by the
  # screenshots in the pull request.
  "crates/ui/src/lib.rs",
  "crates/ui/src/app.rs",
  "crates/ui/src/assets.rs",
  "crates/ui/src/bench.rs",
  "crates/ui/src/card_view.rs",
  "crates/ui/src/browser_view.rs",
  "crates/ui/src/components.rs",
  "crates/ui/src/decks_view.rs",
  "crates/ui/src/nav.rs",
  "crates/ui/src/settings_view.rs",
  "crates/ui/src/statistics_view.rs",
  "crates/ui/src/review_view.rs",
  "crates/ui/src/add_card_view.rs",
  "crates/ui/src/theme.rs",
  # egui view builders and platform entry points need a GPU surface or a real
  # mobile host, so they are covered by target checks and PR screenshots.
  "crates/bin/src/mobile/ui.rs",
  "crates/bin/src/mobile/platform.rs",
  "crates/bin/src/mobile/mod.rs",
  # Vendored only to patch one libc constant for xattr on Linux.
  "vendor/xattr/*",
  # Upstream winit source with the Android IME backport. It is third-party code
  # with its own tests, so it does not count toward Ranki's coverage.
  "vendor/winit/*",
]
