name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - run: >-
          nix build
          .#checks.x86_64-linux.build
          .#checks.x86_64-linux.clippy
          .#checks.x86_64-linux.fmt
          .#checks.x86_64-linux.nextest
          --print-build-logs

      - name: Mobile target checks
        run: |
          CC_aarch64_linux_android=gcc CRATE_CC_NO_DEFAULTS=1 \
            nix develop --command cargo check -p ranki-mobile --target aarch64-linux-android
          CC_aarch64_apple_ios=clang CRATE_CC_NO_DEFAULTS=1 \
            nix develop --command cargo check -p ranki-mobile --target aarch64-apple-ios
